[options]

; ══════════════════════════════════════════════════════════════════════════════
; CLEARDEALS — Odoo 19 Local Development Configuration
; Used by: docker-compose.dev.yml
;
; Key differences from production (odoo.conf):
;   - workers = 0          → threaded server; easier to debug; no SIGKILL watchdog
;   - proxy_mode = False   → no Traefik; ports exposed directly
;   - list_db = True       → database selector visible in the UI
;   - generous time limits → don't kill your own debug sessions
;   - dev_mode is NOT set here — it is file_exportable=False in Odoo's config
;     parser. Set it via ODOO_DEV=all in docker-compose.dev.yml environment.
; ══════════════════════════════════════════════════════════════════════════════

; ── Authentication ────────────────────────────────────────────────────────────
admin_passwd = admin

; ── Database ──────────────────────────────────────────────────────────────────
; 'db' resolves to the odoo-dev-db container via Docker's internal DNS.
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Odoo will create this database on first start if it does not exist.
db_name = cleardeals_19_dev

; Show the database selector in the UI — useful in dev to switch databases.
list_db = True

; Slightly relaxed connection pool — threaded mode uses a shared pool across
; all threads, so headroom matters more than in prefork.
db_maxconn = 16

; ── Paths ─────────────────────────────────────────────────────────────────────
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/custom
data_dir = /var/lib/odoo

; ── HTTP ──────────────────────────────────────────────────────────────────────
http_port = 8069

; Gevent port — only active when workers > 0. Exposed in docker-compose.dev.yml
; anyway so you can test with workers = 2 by editing this file.
gevent_port = 8072

; No reverse proxy in local dev — ports are exposed directly from the container.
proxy_mode = False

; ── Workers ───────────────────────────────────────────────────────────────────
; Threaded mode: all requests run in a single process on a thread pool.
; No worker isolation → uncaught exceptions are visible in the main log stream.
; Attach a Python debugger (breakpoint(), debugpy) without worrying about
; which worker process you land in.
;
; Switch to workers = 2 to test prefork behaviour locally before deploying
; (gevent will then start on port 8072 as it does in production).
workers = 0

; ── Resource Limits ───────────────────────────────────────────────────────────
; Generous limits — never kill a session you're actively debugging.
; These apply to the threaded server's request threads.
limit_time_cpu = 300
limit_time_real = 600

; ── Logging ───────────────────────────────────────────────────────────────────
; Log to stdout — visible with: docker compose -f docker-compose.dev.yml logs -f odoo
logfile =

; Use 'debug' here if you want ORM-level SQL logs. 'info' is less noisy.
log_level = info

; Suppress werkzeug access log (every HTTP request) — it floods the terminal.
; Remove the werkzeug:WARNING override if you need to debug HTTP routing.
log_handler = :INFO,werkzeug:WARNING
