# ==============================================================================
# Cleardeals — Odoo 19 Local Development Docker Compose
# ==============================================================================
# Mirrors the production stack (same Dockerfile, same config format) without
# Traefik or TLS. Ports are exposed directly.
#
# The Pub/Sub emulator is NOT defined here — it runs in the WhatsApp
# communications module's own Docker Compose stack. Odoo reaches it via
# host.docker.internal:9085 (Docker Desktop routes this to the Mac host,
# where the emulator's port is exposed). No network coordination needed.
#
# ── Quick start ───────────────────────────────────────────────────────────────
#   docker compose -f docker-compose.dev.yml up --build
#   # Odoo    → http://localhost:8069   (master password: admin)
#   # Postgres → localhost:5434         (user: odoo  password: odoo)
#
# ── First-time DB migration (run once to copy your Mac Postgres data) ─────────
#   # Step 1: start only the DB container and wait for it to be ready
#   docker compose -f docker-compose.dev.yml up db -d
#
#   # Step 2: create the target database inside the container
#   docker exec odoo-dev-db createdb -U odoo cleardeals_19_dev
#
#   # Step 3: dump from your Mac Postgres (port 5432) and pipe straight in
#   pg_dump -U odoo -h 127.0.0.1 -p 5432 cleardeals_19_dev \
#     | docker exec -i odoo-dev-db psql -U odoo -d cleardeals_19_dev
#
#   # Step 4: bring everything up
#   docker compose -f docker-compose.dev.yml up -d
#
#   After this, data lives in ./odoo-dev-db-data on your Mac. It survives
#   docker compose down / up indefinitely. Only 'rm -rf odoo-dev-db-data'
#   would destroy it.
#
# ── Tear down (keep data) ─────────────────────────────────────────────────────
#   docker compose -f docker-compose.dev.yml down
#
# ── Update a module after code change ─────────────────────────────────────────
#   docker exec odoo-dev-app python3 /usr/bin/odoo \
#     -d cleardeals_19_dev -u my_module --stop-after-init
#
# ── Open a Python shell against the running DB ───────────────────────────────
#   docker exec -it odoo-dev-app python3 /usr/bin/odoo shell \
#     -d cleardeals_19_dev
#
# ── Note on dev_mode auto-reload ──────────────────────────────────────────────
#   ODOO_DEV=all enables file-change watching (reload,qweb,xml,access).
#   On macOS + Docker Desktop this requires VirtioFS to be enabled:
#   Docker Desktop → Settings → Resources → File Sharing → VirtioFS
#   Without VirtioFS, inotify events don't cross the VM boundary.
#   If auto-reload is unreliable, use the module update command above.
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # PostgreSQL 17 — dev instance (simple config, no performance tuning needed)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:17
    container_name: odoo-dev-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo

    volumes:
      # Separate data dir — never shares state with the production bind mount
      - ./odoo-dev-db-data:/var/lib/postgresql/data

    ports:
      # Connect from your Mac with TablePlus / pgAdmin:
      # host=localhost  port=5434  user=odoo  password=odoo  db=cleardeals_19_dev
      - "5434:5432"

    networks:
      - dev

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      # On a cold start Postgres must initialise the data dir before pg_isready works
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Odoo 19 — same Dockerfile and entrypoint as production
  # ----------------------------------------------------------------------------
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    image: odoo-cleardeals:dev
    container_name: odoo-dev-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      # ── Odoo dev mode ────────────────────────────────────────────────────────
      # file_exportable=False means this cannot go in odoo.dev.conf.
      # 'all' expands to: access, reload, qweb, xml
      #   access  → log traceback of permission errors
      #   reload  → restart server on Python file changes (needs VirtioFS on macOS)
      #   qweb    → log compiled XML on QWeb template errors
      #   xml     → reload XML view definitions without restart
      - ODOO_DEV=all

      # ── Pub/Sub — DEFAULTS TO THE OFFLINE EMULATOR ───────────────────────────
      # This file previously HARDCODED cleardeals-wa-prod / GCP_ENV=production,
      # which meant a `make up` on a laptop published straight into the live
      # cd-prod-* topics and reached real customers on WhatsApp. The dev stack is
      # for testing; the default must be the one that cannot page anybody.
      #
      # All three are overridable from .env so the escape hatch still exists, but
      # reaching production is now an explicit, written-down act rather than the
      # default state of a checked-out repo.
      #
      # PUBSUB_EMULATOR_HOST uses `-` and not `:-` deliberately. Compose's `:-`
      # substitutes the default for an EMPTY value too, which would make
      # `PUBSUB_EMULATOR_HOST=` in .env silently snap back to the emulator and
      # strand you in local mode. With `-`, an explicitly empty value stays
      # empty, and every consumer tests it with bool() — see
      # push_controller.py:96 and cleardeals_pubsub/models/pubsub_publisher.py —
      # so empty correctly means "not the emulator".
      #
      # Setting it also makes /wa/pubsub/push skip OIDC verification, which is
      # what you want against the emulator (it issues no tokens) and exactly what
      # you do NOT want when pointed at a real project.
      #
      # To test against the TEST Interakt account end-to-end, leave these alone —
      # see docs/LOCAL_TEST_ACCOUNT.md in the platform repo.
      - PUBSUB_PROJECT_ID=${PUBSUB_PROJECT_ID:-cleardeals-wa-local}
      - PUBSUB_EMULATOR_HOST=${PUBSUB_EMULATOR_HOST-host.docker.internal:9085}

      # Topic aliases that the code prefixes at runtime (wa_workflow.py builds
      # 'cd-{prefix}-{alias}'). 'local' → cd-local-*, which is what
      # scripts/create_local_pubsub.py seeds in the emulator. 'production' → prod.
      - GCP_ENV=${GCP_ENV:-local}

      # Application Default Credentials — google-cloud-pubsub picks this up.
      # Mounted read-only from the host (see volumes below).
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp/application_default_credentials.json

    volumes:
      # Dev config — read-only (same as production, different content)
      - ./odoo.dev.conf:/etc/odoo/odoo.conf:ro

      # Host ADC (gcloud auth application-default login) — read-only, so the
      # container authenticates as the logged-in user rather than needing a
      # long-lived service-account key on disk.
      - ~/.config/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro

      # Separate filestore — never shares attachments with production data
      - ./odoo-dev-web-data:/var/lib/odoo

      # Live mount — edit files on your Mac, changes are immediately visible
      # inside the container. With ODOO_DEV=reload, Odoo restarts automatically
      # on Python changes (subject to VirtioFS note above).
      - ./custom_addons:/mnt/extra-addons/custom

    # Ports are NOT exposed directly to the host — nginx (below) owns port 8069
    # and routes /websocket + /longpolling to the gevent worker (8072) and
    # everything else to the HTTP workers (8069).  Add the ports back here only
    # if you need to bypass nginx for low-level debugging.

    networks:
      - dev

  # ----------------------------------------------------------------------------
  # Nginx — dev reverse proxy (mirrors Traefik routing from production)
  # Routes /websocket and /longpolling → odoo:8072 (gevent)
  # Routes everything else             → odoo:8069 (HTTP workers)
  # Required when workers > 0 in odoo.dev.conf.
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: odoo-dev-nginx
    restart: unless-stopped

    depends_on:
      - odoo

    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

    ports:
      - "8069:80"   # Odoo web UI → http://localhost:8069 (same URL as before)

    networks:
      - dev

# ==============================================================================
# Networks
# ==============================================================================
networks:
  dev:
    driver: bridge
    name: odoo-dev
