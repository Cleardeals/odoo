# odoo.prod.conf — production Odoo configuration.
#
# This file is COMMITTED. It carries no secrets: the two that exist
# (admin_passwd, db_password) live in Secret Manager and are injected at
# container start by scripts/render_odoo_conf.sh, which writes the assembled
# file to tmpfs. The rendered result never touches the persistent disk, so it
# never lands in a disk snapshot.
#
# Placeholders below are substituted verbatim by that script.
#
# Before this file existed, the entire production config was a 212-byte blob in
# a GitHub Actions secret, written to disk on every deploy. Nobody could review
# a change to it, and nobody did.

[options]

# ── Secrets, injected at runtime ───────────────────────────────────────────────
admin_passwd = __ADMIN_PASSWD__
db_password = __DB_PASSWORD__

# ── Database ───────────────────────────────────────────────────────────────────
db_host = db
db_port = 5432
db_user = odoo

# dbfilter + list_db are the two settings that close the database manager.
#
# Without list_db = False, Odoo serves /web/database/manager to ANY
# unauthenticated request — verified returning HTTP 200 with a working
# "Create Database" / "Master Password" form on the public hostname. That page
# will back up and download the entire database, duplicate it, restore over it,
# or drop it. The only thing in front of it is admin_passwd, and it is not
# rate-limited.
#
# dbfilter pins the instance to exactly one database so the selector cannot
# enumerate others.
db_name = odoo_db
dbfilter = ^odoo_db$
list_db = False

# ── HTTP ───────────────────────────────────────────────────────────────────────
http_port = 8069
gevent_port = 8072
proxy_mode = True

# ── Addons ─────────────────────────────────────────────────────────────────────
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/custom
data_dir = /var/lib/odoo

# ── Workers ────────────────────────────────────────────────────────────────────
#
# PHASE 2 LEAVES THIS AT ZERO ON PURPOSE.
#
# Production runs threaded today — a single `python3 /usr/bin/odoo` process. Two
# independent reasons not to change it in this phase:
#
#   1. The machine is still an e2-medium: 2 SHARED vCPUs and 4 GB. Five workers
#      do not fit. Phase 4 moves to e2-standard-2 first.
#
#   2. With workers > 0 Odoo moves the bus to a separate gevent process on port
#      8072, and the compose file on this branch routes only /longpolling — the
#      Odoo 8-era path. Odoo 19 clients connect to /websocket, which currently
#      routes nowhere. Turning on prefork before fixing that silently kills every
#      realtime update in the UI.
#
# Phase 4 target, with the arithmetic that produced it:
#   workers = 5, max_cron_threads = 2, db_maxconn = 10
#   connections: 10 x (5 + 2 + 1) = 80, under Postgres max_connections = 100
#   memory:      5 x 1200 MB = 6 GB of 8 GB, leaving 2 GB for Postgres and the OS
# Copying staging's db_maxconn = 16 would give 128 connections and fail
# intermittently under load, not cleanly at boot.
workers = 0
max_cron_threads = 1

# ── Limits ─────────────────────────────────────────────────────────────────────
# Production has had NO limits of any kind, so a single runaway request can
# consume the whole box. These apply in threaded mode too, which is why they are
# not deferred to Phase 4 with the worker counts.
#
# limit_memory_* are deliberately omitted while workers = 0: in threaded mode
# they apply to the single process, and killing it is an outage rather than a
# recycled worker. They arrive in Phase 4 together with prefork.
limit_time_cpu = 120
limit_time_real = 240
limit_time_real_cron = 0
limit_request = 65536

# ── Logging ────────────────────────────────────────────────────────────────────
# Empty logfile = log to stdout, which is what the Ops Agent will collect once
# it can actually write. It is installed and running today but silently dropping
# everything, because the VM's service account cannot call
# monitoring.timeSeries.create. Phase 4 fixes that by attaching odoo-prod-vm@.
logfile =
log_level = info
log_handler = :INFO,werkzeug:WARNING
