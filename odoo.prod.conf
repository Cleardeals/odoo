# odoo.prod.conf — production Odoo configuration.
#
# This file is COMMITTED. It carries no secrets: the two that exist
# (admin_passwd, db_password) live in Secret Manager and are injected at
# container start by scripts/render_odoo_conf.sh, which writes the assembled
# file to tmpfs. The rendered result never touches the persistent disk, so it
# never lands in a disk snapshot.
#
# Placeholders below are substituted verbatim by that script.
#
# Before this file existed, the entire production config was a 212-byte blob in
# a GitHub Actions secret, written to disk on every deploy. Nobody could review
# a change to it, and nobody did.

[options]

# ── Secrets, injected at runtime ───────────────────────────────────────────────
admin_passwd = __ADMIN_PASSWD__
db_password = __DB_PASSWORD__

# ── Database ───────────────────────────────────────────────────────────────────
db_host = db
db_port = 5432
db_user = odoo

# dbfilter + list_db are the two settings that close the database manager.
#
# Without list_db = False, Odoo serves /web/database/manager to ANY
# unauthenticated request — verified returning HTTP 200 with a working
# "Create Database" / "Master Password" form on the public hostname. That page
# will back up and download the entire database, duplicate it, restore over it,
# or drop it. The only thing in front of it is admin_passwd, and it is not
# rate-limited.
#
# dbfilter pins the instance to exactly one database so the selector cannot
# enumerate others.
db_name = odoo_db
dbfilter = ^odoo_db$
list_db = False

# ── HTTP ───────────────────────────────────────────────────────────────────────
http_port = 8069
gevent_port = 8072
proxy_mode = True

# ── Addons ─────────────────────────────────────────────────────────────────────
# /opt/cleardeals-addons, NOT /mnt/extra-addons/custom. The base image declares
# /mnt/extra-addons as a VOLUME, so Docker shadows it with an empty anonymous
# volume at runtime and the baked addons disappear.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/opt/cleardeals-addons
data_dir = /var/lib/odoo

# ── Workers (prefork) ──────────────────────────────────────────────────────────
#
# Enabled in Phase 4d, after the machine went to e2-standard-2 (2 vCPU, 7936MB)
# and AFTER the /websocket route was already live and proven in production —
# with workers > 0 the bus moves to a separate gevent process on :8072, and
# without that route every realtime update stops silently.
#
# PROCESS COUNT. Verified against odoo/service/server.py process_spawn():
#   workers            -> that many WorkerHTTP
#   max_cron_threads   -> that many WorkerCron
#   plus ONE long-polling (gevent) process when http_enable
# so this is 4 + 2 + 1 = 7 worker processes.
#
# POSTGRES CONNECTIONS. db_maxconn is PER PROCESS — odoo/sql_db.py builds the
# pool as a module-level global. Critically there are TWO pools, _Pool and
# _Pool_readonly, and http.py:2222 takes a readonly cursor on EVERY request.
# With no db_replica_host configured, connection_info_for() falls back to the
# primary, so those are separate physical connections to the same Postgres.
#
# The ceiling is therefore 2 x db_maxconn per process, not one:
#     7 processes x 2 pools x 6 = 84, against max_connections = 100
# Realistically cron workers only write, giving 72.
#
# This is why staging's db_maxconn = 16 must NOT be copied: at this process
# count it permits 224 connections, and the failure is intermittent
# "FATAL: sorry, too many clients already" under load rather than a clean error
# at boot — which reads like an application bug for weeks.
#
# MEMORY. Measured on the live box before choosing these: a single Odoo process
# is 270MB RSS, Postgres 188MB, Traefik 25MB, host 7936MB with 6751 available.
#     7 x 768MB hard = 5376MB, + postgres ~800 + os ~700 + traefik 25 = 6901MB
# leaving about 1GB. soft is the graceful recycle (after the current request),
# hard is the immediate kill; 640 is well clear of the 270MB baseline so workers
# are not churning constantly.
workers = 4
max_cron_threads = 2
db_maxconn = 6

# 4 rather than the usual 2*cores+1 = 5. The extra worker is worth little on
# two vCPUs and costs 768MB of ceiling plus 12 connections of headroom. Raise it
# deliberately later if the workers are genuinely saturated, not pre-emptively.

# ── Limits ─────────────────────────────────────────────────────────────────────
# Production has had NO limits of any kind, so a single runaway request can
# consume the whole box. These apply in threaded mode too, which is why they are
# not deferred to Phase 4 with the worker counts.
#
# limit_memory_* are safe now that workers > 0: they recycle ONE worker rather
# than killing the only process, which is why they were omitted while threaded.
#
# THESE ARE VIRTUAL MEMORY LIMITS, NOT RESIDENT. odoo/service/server.py applies
# limit_memory_hard as RLIMIT_AS, and process_limit() compares limit_memory_soft
# against psutil memory_info, which on Linux is VMS. Python reserves far more
# address space than it resides in.
#
# Measured on a rehearsal of this exact image and config, AT IDLE:
#     RSS 141-182 MB   but   VIRT 663-727 MB
#
# The first values tried here were soft 640MB / hard 768MB, budgeted against
# physical RAM. That is a category error: both sit BELOW the idle virtual
# footprint, so every worker hit the limit the moment it started and recycled
# forever — 5801 "virtual memory limit reached" messages in a few minutes of
# rehearsal. In production that would have meant constant churn under load.
#
# 1280/1792 MB is what staging has run prefork on for months, and leaves ~550MB
# of virtual headroom above idle before a graceful recycle. Odoo's own defaults
# are higher still (2048/2560).
#
# Real RAM use is governed by RSS, not these: 7 processes at ~180MB idle is
# ~1.3GB of the 7936MB on this machine, with room to grow under load.
limit_memory_soft = 1342177280
limit_memory_hard = 1879048192
limit_time_cpu = 120
limit_time_real = 240
limit_time_real_cron = 0
limit_request = 65536

# ── Logging ────────────────────────────────────────────────────────────────────
# Empty logfile = log to stdout, which is what the Ops Agent will collect once
# it can actually write. It is installed and running today but silently dropping
# everything, because the VM's service account cannot call
# monitoring.timeSeries.create. Phase 4 fixes that by attaching odoo-prod-vm@.
logfile =
log_level = info
log_handler = :INFO,werkzeug:WARNING
