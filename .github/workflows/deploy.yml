name: Deploy Odoo 19 to New VM

on:
  workflow_run:
    workflows: ["Run Odoo Tests"]
    branches: ["19.0"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy to Odoo 19 VM
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: SSH into VM and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }} 
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          debug: true
          script: |
            set -e
            echo ">>> Connected as $(whoami)"
            
            # --- 1. SSH Configuration (The "Key" to Success) ---
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            
            # Create a config file that tells Git EXACTLY how to talk to GitHub
            cat > ~/.ssh/config << EOF
            Host github.com
              HostName github.com
              User git
              IdentityFile ~/.ssh/id_ed25519
              IdentitiesOnly yes
              StrictHostKeyChecking no
              LogLevel ERROR
            EOF
            chmod 600 ~/.ssh/config
            
            # Ensure the key we want to use has the right permissions
            chmod 600 ~/.ssh/id_ed25519
            
            # Add to agent just in case
            eval "$(ssh-agent -s)" > /dev/null
            ssh-add ~/.ssh/id_ed25519 > /dev/null 2>&1 || echo ">>> Key add warning (ignoring)"
            
            # --- 2. Project Setup ---
            mkdir -p ~/odoo-project
            cd ~/odoo-project
            
            # --- 3. Git Operations ---
            if [ ! -d ".git" ]; then
              echo ">>> Cloning repo for the first time..."
              # We don't need GIT_SSH_COMMAND because ~/.ssh/config handles it now!
              git clone -b 19.0 git@github.com:Cleardeals/odoo.git .
            else
              echo ">>> Pulling latest changes from branch 19.0..."
              git remote set-url origin git@github.com:Cleardeals/odoo.git
              git fetch origin 19.0
              git reset --hard origin/19.0
            fi
            
            # --- 4. Docker Operations ---
            echo ">>> Rebuilding Odoo 19 image..."
            sudo docker compose build odoo
            
            echo ">>> Restarting the Odoo Service..."
            sudo docker compose up -d --force-recreate odoo
            
            echo ">>> Pruning unused Docker objects..."
            sudo docker system prune -f
            
            echo ">>> Deployment Finished Successfully!"