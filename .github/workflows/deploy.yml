name: Deploy Odoo 19 to New VM

on:
  workflow_run:
    workflows: ["Run Odoo Tests"]
    branches: ["19.0"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy to Odoo 19 VM
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }} 
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd ~/odoo-project || mkdir -p ~/odoo-project && cd ~/odoo-project
            
            # Clone or update repo
            if [ ! -d ".git" ]; then
              git clone -b 19.0 git@github.com:Cleardeals/odoo.git .
            else
              git fetch origin 19.0
              git reset --hard origin/19.0
            fi
            
            # Rebuild and restart
            docker compose build odoo
            docker compose up -d --force-recreate odoo
            docker system prune -f
            
            echo "Deployment complete!"