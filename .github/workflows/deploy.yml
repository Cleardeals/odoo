name: Deploy Odoo 19 to New VM

on:  
  # Trigger : Only run when the test workflow finishes successfully
  workflow_run:
    workflows: ["Run Odoo Tests"]
    branches: ["19.0"]
    types:
      - completed  

jobs:
  deploy:
    name: Deploy to Odoo 19 VM
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: SSH into VM and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Make sure these secrets point to your NEW Odoo 19 VM
          host: ${{ secrets.VM_IP }} 
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          debug: true
          script: |
            set -e
            echo "Connected as $(whoami)"
            
            # Quick VM diagnostics
            echo ">>> SSH dir permissions: $(ls -ld ~/.ssh)"
            echo ">>> SSH key permissions: $(ls -la ~/.ssh/id_ed25519*)"
            echo ">>> Testing SSH auth in script..."
            ssh -T git@github.com || echo "SSH test failed in script"
            
            # Ensure SSH config prioritizes the ed25519 key (idempotent)
            mkdir -p ~/.ssh
            cat > ~/.ssh/config << EOF
            Host github.com
              HostName github.com
              User git
              IdentityFile ~/.ssh/id_ed25519
              IdentitiesOnly yes
              StrictHostKeyChecking no
              LogLevel VERBOSE
            EOF
            chmod 700 ~/.ssh
            chmod 600 ~/.ssh/config ~/.ssh/id_ed25519
            
            # Load agent explicitly (fallback)
            eval "$(ssh-agent -s)" > /dev/null
            ssh-add ~/.ssh/id_ed25519 > /dev/null 2>&1 || echo ">>> Key add warning (may not need agent)"
            
            # Ensure folder exists
            mkdir -p ~/odoo-project
            cd ~/odoo-project
            
            # Initialize repo if empty, otherwise pull (with verbose & timeout)
            if [ ! -d ".git" ]; then
              echo ">>> Cloning repo for the first time..."
              timeout 120 GIT_SSH_COMMAND="ssh -vvv" git clone -b 19.0 git@github.com:Cleardeals/odoo.git . || (echo ">>> Clone timed out/failed - check logs"; exit 1)
            else
              echo ">>> Pulling latest changes from branch 19.0..."
              git remote set-url origin git@github.com:Cleardeals/odoo.git
              timeout 120 GIT_SSH_COMMAND="ssh -vvv" git fetch origin 19.0 || (echo ">>> Fetch timed out/failed"; exit 1)
              git reset --hard origin/19.0
            fi
            
            echo ">>> Rebuilding Odoo 19 image..."
            docker compose build odoo
            
            echo ">>> Restarting the Odoo Service..."
            docker compose up -d --force-recreate odoo
            
            echo ">>> Pruning unused Docker objects..."
            docker system prune -f
            
            echo ">>> Deployment Finished Successfully!"