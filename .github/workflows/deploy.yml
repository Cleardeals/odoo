name: Deploy Odoo 19 to New VM

on:
  workflow_run:
    workflows: ["Run Odoo Tests"]
    branches: ["19.0"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy to Odoo 19 VM
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          ODOO_CONF: ${{ secrets.ODOO_CONF }}
        with:
          host: ${{ secrets.VM_IP }} 
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          envs: ODOO_CONF
          script: |
            set -e
            cd ~/odoo-project || { mkdir -p ~/odoo-project && cd ~/odoo-project; }
            
            if [ ! -d ".git" ]; then
              echo "Cloning repository..."
              timeout 300 git clone --depth 1 -b 19.0 git@github.com:Cleardeals/odoo.git . || exit 1
            else
              echo "Updating repository..."
              timeout 300 git fetch --depth 1 origin 19.0 || exit 1
              git reset --hard origin/19.0
            fi
            
            echo "Creating odoo.conf..."
            echo "$ODOO_CONF" > odoo.conf
            
            echo "Rebuilding Docker image..."
            docker compose build odoo
            
            echo "Restarting containers..."
            docker compose up -d --force-recreate odoo
            
            echo "Cleaning up..."
            docker system prune -f
            
            echo "Deployment complete!"