# ==============================================================================
# Cleardeals — Odoo 19 Dev Nginx
# Routes WebSocket (/websocket) and long-polling (/longpolling) traffic to the
# gevent worker (odoo:8072) and all other traffic to the HTTP workers (odoo:8069).
# Mirrors the Traefik routing rules in docker-compose.yml (production).
# ==============================================================================

upstream odoo_http {
    server odoo:8069;
}

upstream odoo_gevent {
    server odoo:8072;
}

server {
    listen 80;
    server_name _;

    # ── WebSocket — must hit the gevent worker (port 8072) ────────────────────
    # Without this routing the HTTP workers raise:
    #   RuntimeError: Couldn't bind the websocket. Is the connection opened
    #   on the evented port (8072)?
    location /websocket {
        proxy_pass         http://odoo_gevent;
        proxy_http_version 1.1;

        # WebSocket upgrade handshake headers
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long-lived WebSocket connections — match production Traefik settings
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Long-polling — also handled by the gevent worker ─────────────────────
    location /longpolling {
        proxy_pass       http://odoo_gevent;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else — standard HTTP workers ───────────────────────────────
    location / {
        proxy_pass       http://odoo_http;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect   off;

        # Support large file uploads (attachments, module imports)
        client_max_body_size 100m;
    }
}
