# cloudbuild.ci.yaml — CI gates. Builds no production image, deploys nothing.
#
# Trigger: pull requests targeting 19.0 and development_19.
#
# The deploy pipeline (cloudbuild.yaml) runs THESE SAME gates before it builds
# anything. That sharing is deliberate: when CI and deploy each keep their own
# idea of "the checks", they drift, and the first anyone notices is a green PR
# that breaks production.

options:
  logging: CLOUD_LOGGING_ONLY # required when running as a custom service account
  machineType: E2_HIGHCPU_8

serviceAccount: "projects/$PROJECT_ID/serviceAccounts/odoo-cloudbuild@$PROJECT_ID.iam.gserviceaccount.com"

steps:
  # ── Build the test image ─────────────────────────────────────────────────────
  # Same Dockerfile as production, so the tests run against the image that would
  # ship — including the baked-in custom_addons.
  - id: build-test-image
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "odoo-ci:$SHORT_SHA", "."]

  # ── Postgres for the test run ────────────────────────────────────────────────
  - id: test-db
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"] # start immediately, in parallel with the image build
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker network create odoo-ci-net 2>/dev/null || true
        docker run -d --name odoo-ci-db --network odoo-ci-net \
          -e POSTGRES_USER=odoo -e POSTGRES_PASSWORD=odoo \
          -e POSTGRES_DB=odoo_test_db postgres:17
        # Poll for real readiness. A fixed sleep is the classic cause of a
        # flaky pipeline that fails once a fortnight and gets retried instead
        # of fixed.
        for i in $(seq 1 60); do
          if docker exec odoo-ci-db pg_isready -U odoo >/dev/null 2>&1; then
            echo "postgres ready after ${i}s"; exit 0
          fi
          sleep 1
        done
        echo "postgres never became ready" >&2; exit 1

  # ── The test suite ───────────────────────────────────────────────────────────
  # Module list matches run_tests.sh DEFAULT_MODULES, which in turn matches the
  # four modules actually installed in production (verified against
  # ir_module_module: leads, lead_suggestor, cleardeals_dashboards, properties).
  - id: test
    name: gcr.io/cloud-builders/docker
    waitFor: [build-test-image, test-db]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker run --rm --network odoo-ci-net odoo-ci:$SHORT_SHA \
          odoo -d odoo_test_db \
          --db_host=odoo-ci-db --db_port=5432 \
          --db_user=odoo --db_password=odoo \
          --addons-path=/opt/cleardeals-addons,/usr/lib/python3/dist-packages/odoo/addons \
          -i leads,lead_suggestor,cleardeals_dashboards,properties \
          --test-enable \
          --test-tags /leads,/lead_suggestor,/cleardeals_dashboards,/properties \
          --stop-after-init \
          --log-level=test

  # ── Config sanity ────────────────────────────────────────────────────────────
  # Cheap, and guards the change that closed the database manager. If someone
  # ever drops list_db or dbfilter from odoo.prod.conf, the manager silently
  # reopens on the public internet and nothing else in this pipeline notices.
  - id: config-check
    name: python:3.12-slim
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python3 - <<'PY'
        import configparser, sys
        c = configparser.ConfigParser()
        # Placeholders are not yet substituted here, which is fine: this checks
        # structure and the security-critical settings, not the secrets.
        c.read("odoo.prod.conf")
        o = c["options"]
        fail = []
        if o.get("list_db", "True").strip() != "False":
            fail.append("list_db must be False — otherwise /web/database/manager "
                        "is served to unauthenticated requests")
        if not o.get("dbfilter", "").strip():
            fail.append("dbfilter must be set")
        if "__ADMIN_PASSWD__" not in o.get("admin_passwd", ""):
            fail.append("admin_passwd must stay a placeholder — never commit a real secret")
        if "__DB_PASSWORD__" not in o.get("db_password", ""):
            fail.append("db_password must stay a placeholder — never commit a real secret")
        if fail:
            print("odoo.prod.conf FAILED:"); [print("  -", f) for f in fail]; sys.exit(1)
        print("odoo.prod.conf OK: manager closed, no secrets committed")
        PY

  # ── Shell scripts must parse ─────────────────────────────────────────────────
  # deploy.sh and render_odoo_conf.sh only ever run in anger. A syntax error
  # would surface mid-deploy, on production.
  - id: shell-syntax
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    entrypoint: bash
    args: ["-c", "for f in scripts/*.sh; do bash -n \"$f\" && echo \"ok $f\"; done"]

  # ── The image must contain EXACTLY the git-tracked modules ──────────────────
  #
  # This gate exists because of a real near-miss. Docker does not read
  # .gitignore, so a build context is "everything in the directory". A local
  # build of the baked-addons image picked up TWELVE modules from a working tree
  # where only seven were tracked — silently including the entire unreleased
  # WhatsApp suite in what would have been a production image.
  #
  # Cloud Build checks out from git and so is not affected. But "the CI machine
  # happens to be clean" is not a control, and .dockerignore cannot express
  # "tracked files only". This makes it explicit and enforced.
  - id: image-contents
    name: gcr.io/cloud-builders/docker
    waitFor: [build-test-image]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        baked=$(docker run --rm --entrypoint /bin/ls odoo-ci:$SHORT_SHA                   /opt/cleardeals-addons | sort)
        tracked=$(ls custom_addons | sort)
        if [ "$baked" != "$tracked" ]; then
          echo "IMAGE CONTENTS DO NOT MATCH THE REPOSITORY" >&2
          echo "--- baked into the image ---" >&2; echo "$baked" >&2
          echo "--- present in the checkout ---" >&2; echo "$tracked" >&2
          echo "" >&2
          echo "An image that contains code the repository does not is not" >&2
          echo "reproducible, and its SHA tag is not an honest answer to" >&2
          echo "'what is in production'." >&2
          exit 1
        fi
        echo "image contains exactly the repository's modules:"
        echo "$baked" | sed 's/^/  /'

  # ── Gate: the DEPLOY config is well-formed ──────────────────────────────────
  #
  # This gate exists because CI could not see the deploy pipeline at all, and
  # three production deploy attempts died on defects in cloudbuild.yaml that
  # every gate here had passed:
  #
  #   1. A shell variable named REMOTE was parsed as a Cloud Build substitution,
  #      and the build was rejected at approval. CI never noticed because
  #      cloudbuild.ci.yaml only uses LOWERCASE shell variables, which are not
  #      matched as substitutions. The two files differed invisibly.
  #   2. Escaping it as a doubled dollar fixed the reference but broke the
  #      assignment: "REMOTE: unbound variable".
  #   3. A repo-URL substitution was used but never defined, so Cloud Build
  #      rendered it EMPTY rather than failing, and `git remote set-url origin`
  #      ran with a missing argument.
  #
  # Each was a one-line mistake that cost a full build, an approval, and a
  # round trip. All three are statically detectable.
  - id: deploy-config-check
    name: python:3.12-slim
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet pyyaml
        python3 - <<'PY'
        import re, sys, yaml

        BUILTINS = {"PROJECT_ID","BUILD_ID","PROJECT_NUMBER","LOCATION",
                    "TRIGGER_NAME","COMMIT_SHA","SHORT_SHA","REVISION_ID",
                    "REPO_NAME","REPO_FULL_NAME","BRANCH_NAME","TAG_NAME",
                    "SERVICE_ACCOUNT","SERVICE_ACCOUNT_EMAIL"}
        fail = []

        for path in ("cloudbuild.yaml", "cloudbuild.ci.yaml"):
            txt = open(path).read()
            yaml.safe_load(txt)          # must parse at all

            # Undefined _SUBSTITUTIONS render as EMPTY STRING, not an error.
            defined = set()
            if "substitutions:" in txt:
                blk = txt.split("substitutions:", 1)[1].split("\n\n", 1)[0]
                defined = set(re.findall(r"^\s+(_[A-Z0-9_]+):", blk, re.M))
            used = set(re.findall(r"\$\{(_[A-Z0-9_]+)\}", txt))
            for name in sorted(used - defined):
                fail.append(f"{path}: ${{{name}}} is used but never defined — "
                            f"Cloud Build renders it as an empty string")

            # An uppercase dollar-prefixed name without a leading underscore is
            # read as a built-in substitution and rejects the build at approval.
            for m in re.finditer(r"(?<!\$)\$\{?([A-Z][A-Z0-9_]*)\}?", txt):
                if m.group(1) not in BUILTINS and not m.group(1).startswith("_"):
                    fail.append(f"{path}: dollar-{m.group(1)} is neither a "
                                f"built-in substitution nor an underscore-"
                                f"prefixed one. A shell variable here breaks "
                                f"the build — inline it or use lowercase")

        if fail:
            print("DEPLOY CONFIG INVALID:")
            for f in sorted(set(fail)):
                print("  -", f)
            sys.exit(1)
        print("deploy config OK: substitutions defined, no stray shell variables")
        PY

  # TODO(openapi): the route-coverage gate that fails CI when a controller route
  # has no OpenAPI spec lives only on feature/ml-matching-integration — it is not
  # on 19.0 or development_19 (verified: docs/api/openapi is absent from both).
  # Add the step here in the same change that merges it, rather than referencing
  # a path that does not exist and skipping silently.

timeout: 2400s
